<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕷️ Happy Birthday My Hero! 🕷️</title>
    <link rel="stylesheet" href="style.css">

    <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Webbing Overlay Background -->
    <div class="web-overlay"></div>

    <header>
        <h1>Happy Birthday! 🕸️</h1>
        <p>To my favorite superhero 💖</p>
    </header>

    <main class="container">
    
        <section class="envelope-section">
          <h2>📩 You've Received a Special Mission!</h2>
          <p class="instruction">Click the envelope to open your letter 💌</p>

          <div class="envelope-wrapper" id="envelope">
            <div class="envelope">
              <div class="flap"></div>
              <div class="pocket"></div>
              <div class="letter">
                <div class="letter-content">
                  <h3>Happy Birthday, my love! 🎂</h3>
                  <p>Thank you for being my hero every single day. I hope your day is as amazing as you are!</p>
                  <p class="signature">Forever yours 💕</p>
                </div>
              </div>
            </div>
          </div>
        </section>

    <!-- NEW: Web Shooter Confetti Cannon Button Section -->
    <section class="celebrate-section">
      <button id="web-shooter-btn" class="web-btn">
        🕷️ Blast Birthday Celebration! 🎉
      </button>
    </section>

  </main>

  <!-- Include JavaScript -->
  <script src="script.js"></script>
</body>
</html>
